<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws://localhost:1420; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <link rel="icon" type="image/svg+xml" href="./compass.svg" />
    <title>Compass</title>
    <style>
      /* Paint the dark background before any JS runs, so the window never flashes white. */
      html, body { background: #0e0f13; margin: 0; }
      html[data-theme="light"], html[data-theme="light"] body { background: #eceef2; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
